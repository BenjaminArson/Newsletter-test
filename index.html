<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Newsletter — semaine du 13/07/2026</title>
<style>
/* === PALETTE DE COULEURS === */
/* Variables réutilisées partout : couleur de marque (--pp), textes, fonds, ombre */
:root {
  --pp:#e61653;
  --ink:#262323;
  --muted:#706b68;
  --paper:#fff;
  --soft:#fbf7f8;
  --line:#f0d7df;
  --shadow:0 12px 34px rgba(58,24,34,.10);
}
/* Reset technique universel */
*{box-sizing:border-box}

/* === FOND DE PAGE GLOBAL === */
/* Dégradé de fond derrière toute la newsletter + police par défaut */
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#fff 0%,#fff7fa 48%,#f7f7f6 100%);color:var(--ink)}

/* Conteneur centré, largeur maximale de toute la page */
.app{max-width:1120px;margin:0 auto;padding:28px clamp(16px,4vw,42px) 34px}

/* === CADRE PRINCIPAL === */
/* Le grand cadre externe (bordure rose, coins arrondis) qui contient toute la newsletter */
.newsletter{background:rgba(255,255,255,.88);border:2px solid var(--pp);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}

/* === SECTION DU HAUT (HERO) === */
/* 2 colonnes : logo/titre à gauche, cadre "jour actif" (heroCard) à droite */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;padding:28px;background:radial-gradient(circle at 95% 10%,rgba(230,22,83,.13),transparent 38%),linear-gradient(180deg,#fff,#fff9fb)}
/* Ligne logo + texte, en haut à gauche du hero */
.brand{display:flex;align-items:center;gap:16px;margin-bottom:22px}
/* Taille et cadre du logo */
.logo{width:88px;height:58px;object-fit:contain;background:white;border:1px solid #f2edf0;border-radius:12px;padding:6px}
/* Petit texte en majuscules au-dessus du titre ("Newsletter éditoriale") */
.kicker{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--pp);font-weight:800}
/* Titre principal de la newsletter */
h1{font-size:clamp(24px,5vw,44px);line-height:.98;margin:0 0 14px;letter-spacing:-.045em}
/* Paragraphe d'intro sous le titre (non utilisé actuellement, plus de <p class="lead"> dans le HTML) */
.lead{font-size:17px;line-height:1.55;color:var(--muted);max-width:620px;margin:0}

/* Le cadre rose à droite du hero : affiche le jour sélectionné + son accroche */
.heroCard{border:2px solid var(--pp);border-radius:18px;background:#fff;padding:18px;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;min-height:208px}
/* Le nom du jour, en gros, dans heroCard (ex: "Lundi") */
.bigDay{font-size:14px;font-weight:800;color:var(--pp);text-transform:uppercase;letter-spacing:.08em}
/* Le texte d'accroche du jour, dans heroCard */
.heroHook{font-size:25px;line-height:1.12;font-weight:850;letter-spacing:-.025em;margin:16px 0}
/* Ligne de petites étiquettes/badges (non utilisée actuellement) */
.metaRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 10px;font-size:13px;color:#5c5553;font-weight:700}

/* === BANDE "MENU DE LA SEMAINE" (les 5 boutons jours) === */
.flowWrap{padding:18px 24px 8px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
/* Titre + sous-texte au-dessus des 5 boutons */
.flowTitle{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}
.flowTitle h2{font-size:18px;margin:0}
.flowTitle span{font-size:13px;color:var(--muted)}
/* La grille des 5 boutons (Lundi à Vendredi), une colonne par bouton */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
/* Un bouton jour, au repos */
.step{appearance:none;border:2px solid #f1cbd6;background:#fff;border-radius:16px;padding:13px 10px;text-align:left;cursor:pointer;min-height:112px;transition:.18s ease;position:relative;outline:none}
/* Effet visuel au survol d'un bouton jour */
.step:hover,.step:focus-visible{transform:translateY(-2px);border-color:var(--pp);box-shadow:0 8px 18px rgba(230,22,83,.12)}
/* Style du bouton jour actuellement sélectionné (fond rose plein) */
.step.active{background:var(--pp);border-color:var(--pp);color:white}
/* Les 3 lignes de texte à l'intérieur d'un bouton jour : numéro / nom du jour / thème */
.step .num{font-size:12px;font-weight:900;opacity:.78}
.step .day{display:block;font-size:17px;font-weight:900;margin:5px 0 8px}
.step .theme{font-size:12px;line-height:1.25;color:inherit;opacity:.82}

/* === ZONE PRINCIPALE (article texte + image) === */
/* Grille 2 colonnes : texte de l'article à gauche, image à droite */
.content{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(290px,.85fr);gap:22px;padding:24px}
/* Le cadre du texte de l'article (colonne de gauche) */
.mainPost{border:2px solid var(--pp);border-radius:20px;background:#fff;padding:24px;min-height:418px}
/* Ligne du badge thème, en haut de l'article */
.postHead{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:18px}
/* Le badge coloré (affiche le thème du jour, ex: "Prix de marché") */
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--pp);color:#fff;border-radius:999px;padding:8px 11px;font-weight:850;font-size:13px}
/* Le titre/accroche de l'article */
.postTitle{font-size:30px;line-height:1.05;letter-spacing:-.035em;margin:0;max-width:660px}
/* Le corps du texte de l'article */
.postText{white-space:pre-line;font-size:16px;line-height:1.58;color:#403b39;margin-top:18px}

/* Colonne de droite (contient la carte image) */
.sidebar{display:flex;flex-direction:column;gap:14px}
/* Style générique de carte (bordure fine + coins arrondis) */
.card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:18px}
/* Variante de carte avec bordure rose épaisse (non utilisée actuellement) */
.card.accent{border:2px solid var(--pp);background:#fff8fa}
.card h3{margin:0 0 10px;font-size:16px}
.card p{margin:0;color:var(--muted);line-height:1.46;font-size:14px}
/* Bouton plein largeur (non utilisé actuellement, ancien bouton "copier l'accroche") */
.cta{width:100%;margin-top:14px;border:0;background:var(--pp);color:white;border-radius:14px;padding:14px 16px;font-weight:900;font-size:15px;cursor:pointer}
.cta:hover,.cta:focus-visible{filter:brightness(.94);outline:3px solid rgba(230,22,83,.25);outline-offset:2px}
/* Aperçu façon post Facebook (non utilisé actuellement) */
.socialPreview{display:grid;grid-template-columns:42px 1fr;gap:12px;margin-top:14px;border:1px solid #eee;border-radius:14px;padding:12px;background:white}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pp),#ff7aa3);display:grid;place-items:center;color:#fff;font-weight:900}
.fbName{font-weight:850;font-size:14px}.fbSub{font-size:12px;color:#857f7b;margin-top:1px}

/* === PIED DE PAGE === */
.footer{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:1px solid var(--line);padding:18px 24px;background:#fff7fa;color:#6f6663;font-size:13px}
.footer strong{color:var(--pp)}

/* Message flottant en bas à droite (non utilisé actuellement, ancien "Accroche copiée") */
.toast{position:fixed;right:18px;bottom:18px;background:#262323;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateY(0)}

/* === CARTE IMAGE (colonne de droite) === */
/* La carte qui encadre l'image (padding + centrage) */
.imageCard{
    padding:12px;
    display:flex;
    align-items:center;
    justify-content:center;
}
/* L'image elle-même à l'intérieur de la carte : pleine largeur, coins arrondis, recadrée proprement */
.imageCard img{
    width:100%;
    height:auto;
    border-radius:12px;
    display:block;
    object-fit:cover;
}

@media(max-width:860px){.hero,.content{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}.heroCard{min-height:auto}}
@media(max-width:520px){.app{padding:14px}.hero{padding:20px}.flow{grid-template-columns:1fr}.content{padding:16px}.postTitle{font-size:24px}.footer{flex-direction:column;align-items:flex-start}.logo{width:72px}}
</style>
</head>

<script>
const posts = [{"day":"Article 1","theme":"Article 1","type":"","accent":"10 % de négociation sur un bien avec travaux !","facebook":"10 % de négociation sur un bien avec travaux, ce n’est pas seulement une discussion sur le prix.\n\nLe Journal de l’Agence indique que certaines grandes maisons nécessitant d’importants travaux de rénovation énergétique peuvent dépasser 10 % de négociation, parfois 15 %.\n\nPour un vendeur, ce chiffre doit être lu comme un signal. L’acquéreur n’additionne plus seulement le prix d’achat et les frais de notaire. Il intègre aussi les travaux, le DPE, le coût du crédit, les charges futures et le risque de revente.\n\nCela ne veut pas dire qu’il faut accepter n’importe quelle offre. Mais cela impose de préparer le dossier : diagnostics, estimation des travaux, arguments sur le prix, qualité des photos et positionnement face aux biens concurrents.\n\nUne négociation forte n’est pas toujours une attaque. Parfois, c’est simplement la traduction d’un risque que le vendeur doit apprendre à traiter.","image":"images/newsletter1.jpg"},{"day":"Article 2","theme":"Article 2","type":"","accent":"5 indicateurs pour comprendre le marché immobilier.","facebook":"5 indicateurs valent mieux qu’une impression pour comprendre le marché immobilier.\n\nLa note de conjoncture n°72 des Notaires de France, publiée en juillet 2026, rappelle que le marché ne se résume pas à une hausse ou une baisse des prix. Il faut aussi regarder les volumes de ventes, les délais, les conditions de crédit et la confiance des ménages.\n\nPour un vendeur, cela change la manière de préparer une mise en vente. Un prix cohérent reste essentiel, mais il ne suffit pas si les acquéreurs sont plus sélectifs, plus prudents ou plus sensibles au financement.\n\nPour un acquéreur, c’est aussi un signal : un marché plus prudent peut créer des opportunités de négociation, à condition d’avoir un financement solide et une analyse claire du bien.\n\nAvant de conclure que “le marché repart” ou “le marché bloque”, il faut regarder les faits, secteur par secteur, bien par bien.","image":"images/newsletter2.jpg"},{"day":"Article 3","theme":"Article 3","type":"","accent":"850 000 logements pourraient sortir du statut de passoire énergétique sans travaux !","facebook":"850 000 logements pourraient sortir du statut de passoire énergétique sans travaux : c’est une évolution importante, mais à manier avec prudence.\n\nLe Journal de l’Agence rappelle que l’évolution du calcul du DPE peut améliorer le classement de certains logements chauffés à l’électricité.\n\nPour un vendeur, cela peut changer la perception du bien. Mais un meilleur classement ne règle pas tout : les acquéreurs continueront de regarder les charges, le confort, les travaux, l’isolation et la cohérence du prix.\n\nPour un acquéreur, le DPE doit rester un point d’analyse, pas une simple étiquette. Il faut comprendre ce qu’il mesure, ce qu’il ne dit pas et les travaux réellement nécessaires.\n\nLe bon réflexe avant une vente : vérifier son DPE, anticiper les questions et intégrer ce sujet dans la stratégie de prix dès le départ.","image":"images/newsletter3.jpg"}];
let active = 0;
const flow = document.getElementById('flow');
function short(txt, n) { return txt.length > n ? txt.slice(0,n).trim() + '…' : txt; }
function renderFlow() {
  flow.innerHTML = posts.map((p,i)=>`<button class="step ${i===active?'active':''}" data-i="${i}" aria-pressed="${i===active}"><span class="num">0${i+1}</span><span class="day">${p.day}</span><span class="theme">${p.theme}</span></button>`).join('');
  document.querySelectorAll('.step').forEach(btn=>btn.addEventListener('click',()=>select(+btn.dataset.i)));
}
function select(i) {
  active = i; const p = posts[i];
  document.getElementById('heroDay').textContent = p.day;
  document.getElementById('heroHook').textContent = p.accent;
  document.getElementById('badge').textContent = p.theme;
  document.getElementById('postTitle').textContent = p.accent;
  document.getElementById('postText').textContent = p.facebook;
  const dayImage = document.getElementById('dayImage');
  if (dayImage && p.image) {
    dayImage.src = p.image;
    dayImage.alt = `Illustration — ${p.day}`;
  }
  const miniPost = document.getElementById('miniPost');

if (miniPost) {
    miniPost.textContent = short(p.facebook.replace(/\n+/g,' '), 180);
}
  renderFlow();
}
const copyBtn = document.getElementById('copyBtn');

if (copyBtn) {
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(posts[active].accent);
    } catch (e) {}

    const toast = document.getElementById('toast');
    if (toast) {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1300);
    }
  });
}
select(0);
</script>
